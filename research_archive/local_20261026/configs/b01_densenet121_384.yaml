experiment:
  name: b01_densenet121_384
  seed: 42
data:
  train_manifest: null
  val_manifest: null
  test_manifest: null
  image_root: null
  # Fill these after inspecting the actual metadata; no field names are assumed.
  columns:
    subject_id: null
    study_id: null
    image_path: null
    labels: null
  label_encoding:
    positive: null
    negative: null
    uncertain: null
    missing: null
  input_size: 384
  num_workers: 4
model:
  name: densenet121
  pretrained: imagenet
  num_classes: 10
training:
  batch_size: 16
  epochs: 30
  optimizer: adamw
  backbone_lr: 0.0001
  classifier_lr: 0.0003
  weight_decay: 0.0001
  loss: bce_with_logits
  scheduler: cosine
  warmup_epochs: 2
  precision: fp16_amp
  grad_clip_norm: 1.0
  early_stopping_patience: 8
validation:
  study_fusion: mean_probability
  primary_metric: macro_auc
  auxiliary_metric: macro_f1
  f1_threshold: 0.5
inference:
  batch_size: 16
  submission_filename: submission.csv
  submission_mode: threshold
  threshold: 0.5
