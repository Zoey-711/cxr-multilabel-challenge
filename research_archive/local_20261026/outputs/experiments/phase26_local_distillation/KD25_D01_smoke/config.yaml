experiment:
  name: KD25_D01
  seed: 42
data:
  archive_path: '/AUTHORIZED_DATA/cxr_first.zip'
  train_manifest: null
  val_manifest: null
  test_manifest: null
  image_root: null
  columns:
    subject_id: Subject_id
    study_id: Study_id
    image_path: Dicom_id
    labels: [Predict_class]
  label_encoding:
    positive: semicolon_delimited_class_ids_1_to_10
    unlisted_policy: negative
    negative: unlisted_in_complete_competition_annotation
    uncertain: no_code_observed
    missing: blank_Predict_class_is_error
  input_size: 384
  preprocessing: black_pad_v1
  num_workers: 4
  teacher_oof:
    probabilities: outputs/analysis/phase17_final_handoff_20261023/e17_oof_study_probabilities.csv
    probabilities_sha256: 166be2f254129af7529393b0dd7373ac5932dcf61f915bd9fd48ad864b8ada44
    source_index: outputs/analysis/phase17_final_handoff_20261023/e17_oof_source_index.csv
    source_index_sha256: 8af120357013eadfe79410574a41f4d4d8333b9619ac50464d9bc9d5cf176432
    freeze_manifest: outputs/analysis/phase17_final_handoff_20261023/freeze_manifest.json
    fusion: {D17: 0.25, C17: 0.25, S17: 0.50}
model:
  name: densenet121
  pretrained: imagenet
  num_classes: 10
  pretrained_sha256: a639ec97d7c33b07ae66f0b5fb7d0192f95a3b11b7576c66c0126c2a727c4395
training:
  batch_size: 8
  gradient_accumulation_steps: 2
  effective_batch_size: 16
  epochs: 30
  optimizer: adamw
  backbone_lr: 0.0001
  classifier_lr: 0.0003
  weight_decay: 0.0001
  loss: bce_with_logits
  distillation:
    temperature: 1.0
    hard_fraction: 0.7
    soft_fraction: 0.3
    soft_weighting: inverse_images_per_study
    normalization: separate_hard_and_soft_denominators_per_accumulation_group
  scheduler: cosine
  warmup_epochs: 2
  precision: fp16_amp
  grad_clip_norm: 1.0
  early_stopping_patience: 8
  early_stopping_min_delta: 0.0
validation:
  study_fusion: mean_probability
  primary_metric: macro_auc
  metric_mode: max
  auxiliary_metric: macro_f1
  f1_threshold: 0.5
inference:
  batch_size: 8
