[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cxr-multilabel-challenge"
version = "0.1.0"
description = "Study-level chest X-ray multilabel classification scaffold"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10",
  "PyYAML>=6",
]

[project.optional-dependencies]
inference = ["torch==2.10.0", "torchvision==0.25.0"]
train = ["torch==2.10.0", "torchvision==0.25.0", "scikit-learn>=1.5", "tensorboard>=2.17"]
test = ["torch==2.10.0", "torchvision==0.25.0", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
