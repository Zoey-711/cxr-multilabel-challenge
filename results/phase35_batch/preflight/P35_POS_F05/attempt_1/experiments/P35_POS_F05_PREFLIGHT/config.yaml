model:
  name: efficientnet_v2_s
  pretrained: imagenet
  pretrained_sha256: dd5fe13b1d60ec15317ccc8ca158186e134d3366c3dde9cb9a4e301f2dc66c74
  num_classes: 10
training:
  batch_size: 8
  gradient_accumulation_steps: 2
  epochs: 30
  optimizer: adamw
  backbone_lr: 0.0001
  classifier_lr: 0.0003
  weight_decay: 0.0001
  loss: phase32_weighted_bce
  scheduler: cosine
  warmup_epochs: 2
  precision: fp16_amp
  grad_clip_norm: 1.0
  early_stopping_patience: 6
  ema:
    enabled: true
    decay: 0.999
    update_after_step: 1
    use_buffers: true
  positive_weight:
    rule: sqrt_study_neg_over_pos
    minimum: 1.0
    maximum: 5.0
    source: four_training_folds_only
validation:
  study_fusion: mean_probability
  primary_metric: macro_auc
  auxiliary_metric: macro_f1
  f1_threshold: 0.5
inference:
  batch_size: 16
  submission_filename: submission.csv
  submission_mode: threshold
  threshold: 0.5
phase32:
